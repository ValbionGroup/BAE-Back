services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: bae-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-adonis}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bae-dev-network

  # AdonisJS API (development with hot reload)
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: bae-api-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: &app-environment
      NODE_ENV: development
      PORT: ${PORT:-3333}
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:3333}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-adonis}
      SESSION_DRIVER: ${SESSION_DRIVER:-cookie}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://host.docker.internal:8080}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_CALLBACK_URL: ${KEYCLOAK_CALLBACK_URL}
      KEYCLOAK_ALLOW_INSECURE: ${KEYCLOAK_ALLOW_INSECURE:-true}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:4200}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:4201}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      LYDIA_DRIVER: ${LYDIA_DRIVER:-fake}
      LYDIA_URL: ${LYDIA_URL:-https://lydia-app.com}
      LYDIA_VENDOR_TOKEN: ${LYDIA_VENDOR_TOKEN:-}
      LYDIA_PRIVATE_TOKEN: ${LYDIA_PRIVATE_TOKEN:-}
      LYDIA_CALLBACK_BASE_URL: ${LYDIA_CALLBACK_BASE_URL:-http://localhost:3333}
      LIMITER_STORE: ${LIMITER_STORE:-memory}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${PORT:-3333}:3333'
    user: root
    volumes:
      - .:/app:z
      - node_modules_dev:/app/node_modules
      - adonisjs_dev:/app/.adonisjs
    networks:
      - bae-dev-network

  cron:
    profiles: ['cron']
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: bae-cron-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-environment
    user: root
    volumes:
      - .:/app:z
      - node_modules_dev:/app/node_modules
      - adonisjs_dev:/app/.adonisjs
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        mkdir -p /etc/crontabs
        cat > /etc/crontabs/root <<'CRONTAB'
        */5 * * * * cd /app && node ace lydia:expire
        0 10 * * * cd /app && node ace notify:presence-pending
        0 18 * * * cd /app && node ace notify:presence-upcoming
        */15 * * * * cd /app && node ace notify:dispatch
        CRONTAB
        exec crond -f -l 8 -L /dev/stdout
    networks:
      - bae-dev-network

volumes:
  postgres_dev_data:
    driver: local
  # Named volumes persist between restarts without conflicting with bind mount
  node_modules_dev:
    driver: local
  adonisjs_dev:
    driver: local

networks:
  bae-dev-network:
    driver: bridge
