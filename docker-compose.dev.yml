services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: bae-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-adonis}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bae-dev-network

  # AdonisJS API (development with hot reload)
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: bae-api-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3333}
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:3333}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-adonis}
      SESSION_DRIVER: ${SESSION_DRIVER:-cookie}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://host.docker.internal:8080}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_CALLBACK_URL: ${KEYCLOAK_CALLBACK_URL}
      KEYCLOAK_ALLOW_INSECURE: ${KEYCLOAK_ALLOW_INSECURE:-true}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:4200}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:4201}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # ⚠️ `fake` par défaut, et sortir de ce défaut demande une raison : les
      # jetons du BAE sont ceux de production, donc `http` en développement
      # déplace de l'argent réel.
      LYDIA_DRIVER: ${LYDIA_DRIVER:-fake}
      LYDIA_URL: ${LYDIA_URL:-https://lydia-app.com}
      LYDIA_VENDOR_TOKEN: ${LYDIA_VENDOR_TOKEN:-}
      LYDIA_PRIVATE_TOKEN: ${LYDIA_PRIVATE_TOKEN:-}
      # Adresse **publique** : c'est Lydia qui l'appelle, depuis ses serveurs.
      # `localhost` y désigne leurs machines — la notification n'arrive alors
      # jamais, et les paiements restent en attente jusqu'à expirer.
      LYDIA_CALLBACK_BASE_URL: ${LYDIA_CALLBACK_BASE_URL:-http://localhost:3333}
    # Fourni d'office par Docker Desktop, absent sous Linux : sans lui l'API n'a
    # aucun moyen de nommer l'hôte.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${PORT:-3333}:3333'
    user: root
    volumes:
      - .:/app:z
      - node_modules_dev:/app/node_modules
      - adonisjs_dev:/app/.adonisjs
    networks:
      - bae-dev-network

volumes:
  postgres_dev_data:
    driver: local
  # Named volumes persist between restarts without conflicting with bind mount
  node_modules_dev:
    driver: local
  adonisjs_dev:
    driver: local

networks:
  bae-dev-network:
    driver: bridge
