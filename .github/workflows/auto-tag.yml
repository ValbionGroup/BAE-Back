name: Auto Tag on Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.AUTOTAG_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Tag the version carried by package.json
        run: |
          set -euo pipefail

          # package.json is the source of truth: the pull request already bumped
          # it, so the tag follows it rather than being recomputed here.
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. The merged package.json was not bumped for this release."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
