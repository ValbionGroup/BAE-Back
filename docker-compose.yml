version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: bae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-adonis}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bae-network

  # AdonisJS API (for production builds)
  api:
    image: registry.eirb.fr/valbiongroup/bae-back:latest
    container_name: bae-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3333}
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:3333}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-adonis}
      SESSION_DRIVER: ${SESSION_DRIVER:-cookie}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      # Sans valeur par défaut, à dessein : `start/env.ts` les déclare
      # obligatoires, donc un déploiement qui les oublie échoue au démarrage
      # plutôt que d'accepter des paiements qui n'aboutiront pas.
      LYDIA_DRIVER: ${LYDIA_DRIVER}
      LYDIA_URL: ${LYDIA_URL}
      LYDIA_VENDOR_TOKEN: ${LYDIA_VENDOR_TOKEN}
      LYDIA_PRIVATE_TOKEN: ${LYDIA_PRIVATE_TOKEN}
      LYDIA_CALLBACK_BASE_URL: ${LYDIA_CALLBACK_BASE_URL}
    ports:
      - '${PORT:-3333}:3333'
    networks:
      - bae-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3333', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  bae-network:
    driver: bridge
