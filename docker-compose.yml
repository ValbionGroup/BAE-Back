version: '3.8'

x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-production}
  PORT: ${PORT:-3333}
  HOST: 0.0.0.0
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_RESPONSE_BODY: ${LOG_RESPONSE_BODY:-false}
  LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL:-http://localhost:3333}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  DB_DATABASE: ${DB_DATABASE:-adonis}
  SESSION_DRIVER: ${SESSION_DRIVER:-cookie}
  JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-BAE}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@bae.eirb.fr}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
  KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
  KEYCLOAK_CALLBACK_URL: ${KEYCLOAK_CALLBACK_URL}
  DASHBOARD_URL: ${DASHBOARD_URL}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  LYDIA_DRIVER: ${LYDIA_DRIVER}
  LYDIA_URL: ${LYDIA_URL}
  LYDIA_VENDOR_TOKEN: ${LYDIA_VENDOR_TOKEN}
  LYDIA_PRIVATE_TOKEN: ${LYDIA_PRIVATE_TOKEN}
  LYDIA_CALLBACK_BASE_URL: ${LYDIA_CALLBACK_BASE_URL}
  LIMITER_STORE: ${LIMITER_STORE:-memory}

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: bae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-adonis}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bae-network

  # AdonisJS API (for production builds)
  api:
    image: registry.eirb.fr/valbiongroup/bae-back:latest
    container_name: bae-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-environment
    ports:
      - '${PORT:-3333}:3333'
    networks:
      - bae-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3333', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Les tâches récurrentes. L'application ne planifie rien elle-même
  # (`NOTIFICATIONS.md`) : la récurrence vit ici, versionnée avec le code plutôt
  # que dans une crontab d'hôte que Portainer ne permet pas de poser.
  #
  # ⚠️ **Un seul exemplaire, jamais répliqué.** Un ordonnanceur s'exécuterait
  # autant de fois qu'il y a d'instances : pour `notify:dispatch`, deux
  # exemplaires enverraient deux fois le même courriel.
  #
  # ⚠️ `user: root` est nécessaire et non un oubli : BusyBox `crond` déduit
  # l'utilisateur du nom du fichier de crontab et fait un `setuid` — sans root
  # il démarre sans bruit et **n'exécute jamais rien**. Seul ce conteneur y
  # passe ; l'API reste en `nodejs`.
  cron:
    image: registry.eirb.fr/valbiongroup/bae-back:latest
    container_name: bae-cron
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-environment
    user: root
    # La crontab est écrite au démarrage plutôt que montée : une stack Portainer
    # n'a pas le dépôt sous la main, donc tout doit tenir dans ce fichier.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        mkdir -p /etc/crontabs
        cat > /etc/crontabs/root <<'CRONTAB'
        # Ferme les demandes de paiement dépassées. Fréquent parce qu'une demande
        # vit 15 min au plus : au-delà, un `pending` ne veut plus rien dire.
        */5 * * * * cd /app && node ace lydia:expire
        # Détection des rappels de présence, puis vidange de la file. Les deux
        # sont séparés pour qu'un SMTP indisponible ne fasse pas perdre la
        # détection.
        0 10 * * * cd /app && node ace notify:presence-pending
        0 18 * * * cd /app && node ace notify:presence-upcoming
        */15 * * * * cd /app && node ace notify:dispatch
        # Purge du journal HTTP. Une ligne y est écrite par requête : sans cette
        # purge la table grossit sans fin, et le COUNT(*) de sa pagination avec
        # elle. À 4 h, hors de toute soirée.
        0 4 * * * cd /app && node ace logs:prune
        CRONTAB
        exec crond -f -l 8 -L /dev/stdout
    networks:
      - bae-network

volumes:
  postgres_data:
    driver: local

networks:
  bae-network:
    driver: bridge
